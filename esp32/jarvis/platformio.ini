; Firmware do Jarvis para o ESP32 clássico (ESP32-WROOM DevKit): botão para falar, microfone INMP441 e DAC PCM5102.
; Fala com a ponte jarvis-voz pelo WebSocket da porta 10800 (protocolo em docs/fase2.md).
;
;   pio run -e esp32 -t upload        compila e grava (a placa ligada no USB)
;   pio device monitor -e esp32       Serial (115200)
;   pio test -e nativo                testes da lógica, no PC, sem placa

[platformio]
default_envs = esp32

[env]
lib_deps = bblanchon/ArduinoJson@7.4.3

[env:esp32]
; pioarduino: o core Arduino 3.x (o platform oficial do PlatformIO parou no 2.x, que não tem o ESP_I2S)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall -Wextra

[env:nativo]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
